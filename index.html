<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#00e676" />
  <meta name="theme-color" content="#00e676" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#00894a" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sheepshead" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/SheepsheadScoringApp/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/SheepsheadScoringApp/icons/icon-192.png" />
  <title>Sheepshead Scorekeeper</title>
  <style>
    :root {
      --bg: #12181b;
      --card-bg: #1e262c;
      --accent: #00e676;
      --partner-color: #29b6f6;
      --sit-color: #78909c;
      --danger: #ff5252;
      --text: #eceff1;
      --subtext: #90a4ae;
      --border: #37474f;
      --header-bg: #1a2127;
      --field-bg: #2a353d;
      --modal-backdrop: rgba(0, 0, 0, 0.65);
      --shadow: rgba(0, 0, 0, 0.35);
      --modal-shadow: rgba(0, 0, 0, 0.45);
      --button-text: #000;
    }
    :root[data-theme="light"] {
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --accent: #00894a;
      --partner-color: #0277bd;
      --sit-color: #78909c;
      --danger: #d32f2f;
      --text: #1b2428;
      --subtext: #546e7a;
      --border: #cfd8dc;
      --header-bg: #e8f0ee;
      --field-bg: #ffffff;
      --modal-backdrop: rgba(18, 24, 27, 0.35);
      --shadow: rgba(38, 50, 56, 0.18);
      --modal-shadow: rgba(38, 50, 56, 0.28);
      --button-text: #fff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -4px -6px 18px;
      padding: 10px 12px;
      position: relative;
      background: var(--header-bg);
      border-radius: 6px;
    }
    h1 {
      margin: 0;
      color: var(--accent);
      font-size: 1.45rem;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-icon {
      width: 1.25em;
      height: 1.25em;
      flex: 0 0 auto;
      border-radius: 6px;
    }
    @media (min-width: 700px) {
      h1 {
        font-size: 2rem;
      }
    }
    .menu-wrapper {
      position: relative;
      flex: 0 0 auto;
    }
    .menu-button {
      width: auto;
      min-width: 92px;
      margin-top: 0;
    }
    .menu-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 20;
      width: 190px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 30px var(--shadow);
    }
    .menu-panel[hidden] {
      display: none;
    }
    .menu-item {
      margin: 0;
      border-radius: 0;
      background: var(--header-bg);
      color: var(--text);
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .menu-item:last-child {
      border-bottom: none;
    }
    .menu-item:hover {
      background: var(--field-bg);
    }
    .card {
      padding: 0;
      margin-bottom: 16px;
    }
    .game-section {
      padding-bottom: 9px;
    }
    .history-section {
      border-top: 1px solid var(--border);
      padding-top: 9px;
    }
    @media (min-width: 700px) {
      .game-section {
        padding-bottom: 18px;
      }
      .history-section {
        padding-top: 18px;
      }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 4px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      background: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    input[type="checkbox"] {
      width: auto;
      padding: 0;
      accent-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: var(--button-text);
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 12px;
      border-radius: 4px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    button.btn-danger {
      background: var(--danger);
      color: #fff;
    }
    button.btn-secondary {
      background: var(--field-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--modal-backdrop);
    }
    .modal-backdrop[hidden] {
      display: none;
    }
    .modal {
      width: min(100%, 560px);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
      box-shadow: 0 24px 60px var(--modal-shadow);
    }
    .modal h2 {
      margin: 0 0 14px;
      color: var(--text);
      font-size: 1.2rem;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .modal-actions button {
      margin-top: 0;
    }
    .modal-actions.single-action {
      grid-template-columns: 1fr;
    }
    .modal-player-row {
      display: grid;
      gap: 8px;
    }
    .sit-checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
      color: var(--text);
      cursor: pointer;
    }
    .sit-checkbox-label.disabled {
      color: var(--subtext);
      cursor: not-allowed;
      opacity: 0.6;
    }
    .theme-toggle-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 0;
      color: var(--text);
    }
    .theme-switch {
      position: relative;
      width: 54px;
      height: 30px;
      flex: 0 0 auto;
    }
    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .theme-switch-slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.2s, border-color 0.2s;
    }
    .theme-switch-slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      background: var(--accent);
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .theme-switch input:checked + .theme-switch-slider::before {
      transform: translateX(24px);
    }

    /* Standings Grid */
    .totals-grid {
      display: grid;
      grid-template-columns: repeat(var(--mobile-player-columns, 3), minmax(0, 1fr));
      gap: 8px;
      text-align: center;
    }
    @media (min-width: 700px) {
      .totals-grid {
        grid-template-columns: repeat(var(--player-count, 6), minmax(0, 1fr));
      }
    }
    .total-card {
      background: var(--field-bg);
      padding: 10px 4px;
      border-radius: 6px;
      border: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      position: relative;
      display: grid;
      grid-template-rows: auto auto 18px;
      align-items: center;
    }
    .total-card:hover {
      border-color: #546e7a;
    }
    .total-card.picker {
      border-color: var(--accent) !important;
      background: rgba(0, 230, 118, 0.15);
    }
    .total-card.partner {
      border-color: var(--partner-color) !important;
      background: rgba(41, 182, 246, 0.15);
    }
    .total-card.sat {
      border-color: var(--sit-color) !important;
      background: rgba(120, 144, 156, 0.2);
      opacity: 0.6;
    }
    .role-badge {
      font-size: 0.65rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 2px 4px;
      border-radius: 3px;
      display: inline-block;
    }
    .role-badge-slot {
      min-height: 18px;
      margin-top: 4px;
    }
    .badge-picker { background: var(--accent); color: #000; }
    .badge-partner { background: var(--partner-color); color: #000; }
    .badge-sat { background: #ffeb3b; color: #000; }
    .badge-sitting { background: #ff9800; color: #000; }

    .total-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .total-score {
      font-size: 1.15rem;
      font-weight: bold;
      margin-top: 2px;
    }
    .pos { color: var(--accent); }
    .neg { color: var(--danger); }

    /* Score Table */
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    th, td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    td.history-picker-cell,
    td.history-partner-cell {
      position: relative;
      font-weight: bold;
    }
    td.history-picker-cell::after,
    td.history-partner-cell::after {
      content: "";
      position: absolute;
      inset: 4px;
      pointer-events: none;
    }
    td.history-picker-cell::after {
      border: 2px solid var(--accent);
      border-radius: 999px;
    }
    td.history-partner-cell::after {
      border: 2px solid var(--partner-color);
      border-radius: 4px;
    }
    th {
      color: var(--subtext);
      font-size: 0.85rem;
      background: var(--header-bg);
    }
    .instruction-text {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-bottom: 10px;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .history-actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
      flex-wrap: nowrap;
      justify-content: flex-end;
    }
    .history-toggle-button {
      width: auto;
      min-width: 104px;
      margin-top: 0;
      padding: 8px 10px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .submit-hand-button {
      display: block;
      width: min(100%, 260px);
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="app-header">
    <h1><img class="title-icon" src="icons/icon-192.png" alt="Sheepshead" />Scorekeeper</h1>
    <div class="menu-wrapper">
      <button class="menu-button" type="button" onclick="toggleMenu()">Menu</button>
      <div class="menu-panel" id="appMenu" hidden>
        <button class="menu-item" type="button" onclick="openNewGameModal()">New Game</button>
        <button class="menu-item" type="button" onclick="openSettingsModal()">Game Settings</button>
        <button class="menu-item" type="button" onclick="openThemeModal()">Theme</button>
      </div>
    </div>
  </div>

  <!-- Current Hand Card -->
  <div class="card game-section">
    <label style="font-weight: bold;">Current Standings</label>
    <div class="instruction-text" id="roleInstruction">
      Tap player cards to assign roles.
    </div>
    <div class="totals-grid" id="totalsGrid"></div>
    <label style="margin: 16px 0 10px; font-weight: bold;">Record Hand Outcome</label>
    <div class="grid">
      <div>
        <label>Hand Outcome</label>
        <select id="outcomeSelect">
          <option value="win">Win - Standard (+2 / +1)</option>
          <option value="schneider">Win - Schneider (+4 / +2)</option>
          <option value="schwarz">Win - No Tricks / Schwarz (+6 / +3)</option>
          <option value="loss">Loss - Double Bump (-4 / -2)</option>
          <option value="schneider-loss">Loss - Schneidered (-8 / -4)</option>
          <option value="schwarz-loss">Loss - No Tricks Taken (-12 / -6)</option>
        </select>
      </div>
      <div>
        <label>Multipliers</label>
        <select id="multiplierSelect">
          <option value="1">1x (Standard)</option>
          <option value="2">2x (Crack / Doubler)</option>
          <option value="4">4x (Re-Crack / Blitz)</option>
        </select>
      </div>
    </div>
    <button class="submit-hand-button" id="submitHandButton" onclick="submitPresetHand()" disabled>Submit Hand</button>
  </div>

  <!-- Score History Table -->
  <div class="card history-section">
    <div class="history-header">
      <label style="margin-bottom: 0; font-weight: bold;">Hand History</label>
      <div class="history-actions">
        <button class="btn-secondary history-toggle-button" type="button" onclick="toggleHistoryScoreMode()" id="historyScoreModeButton">Show Totals</button>
        <button class="btn-secondary history-toggle-button" type="button" onclick="toggleHistoryOrder()" id="historyOrderButton">Newest First</button>
      </div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <form class="modal" onsubmit="saveModal(event)">
    <h2 id="modalTitle">New Game</h2>
    <div id="modalGameTypeField">
      <label>Game Mode</label>
      <select id="modalGameType" onchange="handleModalGameTypeChange()">
        <option value="3-3">3 handed - 3 players</option>
        <option value="3-4">3 handed - 4 players</option>
        <option value="5">5 Handed - 5 players</option>
        <option value="6">5 Handed - 6 players</option>
        <option value="7">5 Handed - 7 players</option>
      </select>
    </div>
    <div class="grid" style="margin-top: 12px;" id="modalPlayerNameInputs"></div>
    <div class="modal-actions">
      <button class="btn-secondary" type="button" onclick="closeModal()">Cancel</button>
      <button type="submit" id="modalSubmitButton">Save</button>
    </div>
  </form>
</div>

<div class="modal-backdrop" id="themeModal" hidden>
  <div class="modal">
    <h2>Theme</h2>
    <label class="theme-toggle-label">
      <span id="themeToggleText">Dark mode</span>
      <span class="theme-switch">
        <input id="themeToggle" type="checkbox" onchange="toggleTheme(this.checked)" />
        <span class="theme-switch-slider"></span>
      </span>
    </label>
    <div class="modal-actions single-action">
      <button type="button" onclick="closeThemeModal()">Done</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "sheepshead_scorekeeper_data";
  const MAX_PLAYERS = 7;

  let state = {
    handed: 5,
    gameType: 6,
    players: ["", "", "", "", "", "", ""],
    roles: { picker: null, partner: null, sat: null },
    fixedSats: [],
    historyNewestFirst: false,
    historyShowTotals: false,
    theme: "dark",
    history: []
  };
  let modalMode = null;

  function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        state = { ...state, ...parsed };
      } catch (e) {
        console.error("Could not parse saved game state", e);
      }
    }
    state.handed = [3, 5].includes(parseInt(state.handed)) ? parseInt(state.handed) : 5;
    state.gameType = [3, 4, 5, 6, 7].includes(parseInt(state.gameType)) ? parseInt(state.gameType) : 6;
    state.theme = state.theme === "light" ? "light" : "dark";
    if (state.gameType < state.handed || state.gameType > state.handed + 2) {
      state.handed = state.gameType <= 4 ? 3 : 5;
    }
    state.players = Array.isArray(state.players) ? state.players : emptyPlayers();
    while (state.players.length < MAX_PLAYERS) {
      state.players.push("");
    }
    if (!state.roles) {
      state.roles = { picker: null, partner: null, sat: null };
    }
    state.fixedSats = fixedSatIndexes();

    normalizeSatRoles();
    applyTheme();
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function initGame() {
    loadState();
    updateStandings();
  }

  function toggleMenu() {
    const menu = document.getElementById("appMenu");
    menu.hidden = !menu.hidden;
  }

  function closeMenu() {
    document.getElementById("appMenu").hidden = true;
  }

  function currentGameModeValue() {
    return state.handed === 3 ? `3-${state.gameType}` : String(state.gameType);
  }

  function parseGameModeValue(value) {
    if (value.includes("-")) {
      const parts = value.split("-").map(part => parseInt(part));
      return { handed: parts[0], gameType: parts[1] };
    }

    return { handed: 5, gameType: parseInt(value) };
  }

  function openNewGameModal() {
    modalMode = "new";
    closeMenu();
    document.getElementById("modalTitle").textContent = "New Game";
    document.getElementById("modalSubmitButton").textContent = "Start Game";
    document.getElementById("modalGameTypeField").hidden = false;
    document.getElementById("modalGameType").value = currentGameModeValue();
    renderModalPlayerInputs(state.gameType, emptyPlayers());
    document.getElementById("settingsModal").hidden = false;
  }

  function openSettingsModal() {
    modalMode = "settings";
    closeMenu();
    document.getElementById("modalTitle").textContent = "Modify Settings";
    document.getElementById("modalSubmitButton").textContent = "Save";
    document.getElementById("modalGameTypeField").hidden = true;
    renderModalPlayerInputs(state.gameType, state.players);
    document.getElementById("settingsModal").hidden = false;
  }

  function openThemeModal() {
    closeMenu();
    updateThemeToggle();
    document.getElementById("themeModal").hidden = false;
  }

  function closeModal() {
    modalMode = null;
    document.getElementById("settingsModal").hidden = true;
  }

  function closeThemeModal() {
    document.getElementById("themeModal").hidden = true;
  }

  function applyTheme() {
    document.documentElement.dataset.theme = state.theme;
  }

  function updateThemeToggle() {
    document.getElementById("themeToggle").checked = state.theme === "light";
    document.getElementById("themeToggleText").textContent = state.theme === "light" ? "Light mode" : "Dark mode";
  }

  function toggleTheme(useLightTheme) {
    state.theme = useLightTheme ? "light" : "dark";
    applyTheme();
    updateThemeToggle();
    saveState();
  }

  function escapeAttribute(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function emptyPlayers() {
    return new Array(MAX_PLAYERS).fill("");
  }

  function sittingPlayerCount() {
    return Math.max(0, state.gameType - state.handed);
  }

  function defaultSatIndexes(count = state.gameType, handed = state.handed) {
    const sittingCount = Math.max(0, count - handed);
    const start = count - sittingCount;
    return Array.from({ length: sittingCount }, (_, index) => start + index);
  }

  function satIndexes() {
    const rawSat = state.roles.sat;
    const values = Array.isArray(rawSat) ? rawSat : rawSat === null ? [] : [rawSat];
    return values
      .map(index => parseInt(index))
      .filter((index, arrayIndex, indexes) => (
        Number.isInteger(index) &&
        index >= 0 &&
        index < state.gameType &&
        indexes.indexOf(index) === arrayIndex
      ));
  }

  function fixedSatIndexes() {
    const values = Array.isArray(state.fixedSats) ? state.fixedSats : [];
    return values
      .map(index => parseInt(index))
      .filter((index, arrayIndex, indexes) => (
        Number.isInteger(index) &&
        index >= 0 &&
        index < state.gameType &&
        indexes.indexOf(index) === arrayIndex
      ))
      .slice(0, sittingPlayerCount());
  }

  function isFixedSat(index) {
    return fixedSatIndexes().includes(index);
  }

  function storeSatIndexes(indexes) {
    const sittingCount = sittingPlayerCount();
    const limited = indexes.slice(0, sittingCount);
    if (sittingCount === 0) {
      state.roles.sat = null;
    } else if (sittingCount === 1) {
      state.roles.sat = limited.length ? limited[0] : null;
    } else {
      state.roles.sat = limited;
    }
  }

  function isSatOut(index) {
    return satIndexes().includes(index);
  }

  function nextAvailableSatIndex(index, reserved) {
    let next = index;
    for (let step = 0; step < state.gameType; step++) {
      next = (next + 1) % state.gameType;
      if (!isFixedSat(next) && !reserved.includes(next)) {
        return next;
      }
    }
    return null;
  }

  function normalizeSatRoles() {
    const sittingCount = sittingPlayerCount();
    const fixed = fixedSatIndexes();
    state.fixedSats = fixed;
    if (fixed.includes(state.roles.picker)) {
      state.roles.picker = null;
    }
    if (fixed.includes(state.roles.partner)) {
      state.roles.partner = null;
    }
    if (state.handed === 3) {
      state.roles.partner = null;
    }

    if (sittingCount === 0) {
      storeSatIndexes([]);
      return;
    }

    const nextSats = fixed.slice();
    const currentFloatingSats = satIndexes().filter(index => !fixed.includes(index));

    for (let i = 0; i < currentFloatingSats.length && nextSats.length < sittingCount; i++) {
      const index = currentFloatingSats[i];
      if (!nextSats.includes(index)) {
        nextSats.push(index);
      }
    }

    const defaults = defaultSatIndexes().filter(index => !fixed.includes(index));
    for (let i = 0; i < defaults.length && nextSats.length < sittingCount; i++) {
      if (!nextSats.includes(defaults[i])) {
        nextSats.push(defaults[i]);
      }
    }

    for (let i = 0; i < state.gameType && nextSats.length < sittingCount; i++) {
      if (!fixed.includes(i) && !nextSats.includes(i)) {
        nextSats.push(i);
      }
    }

    storeSatIndexes(nextSats);
  }

  function resetRoles() {
    const count = state.gameType;
    const sittingCount = sittingPlayerCount();
    const fixed = fixedSatIndexes();
    let nextSats = fixed.slice();

    // If transitioning from previous round, rotate sitting player clockwise
    if (sittingCount > fixed.length) {
      const currentSats = satIndexes().filter(index => !fixed.includes(index));
      if (currentSats.length === sittingCount - fixed.length) {
        currentSats.forEach(index => {
          const next = nextAvailableSatIndex(index, nextSats);
          if (next !== null) {
            nextSats.push(next);
          }
        });
      }
    }

    state.roles = { picker: null, partner: null, sat: null };
    if (nextSats.length < sittingCount) {
      state.roles.sat = nextSats;
      normalizeSatRoles();
      return;
    }
    storeSatIndexes(nextSats);
  }

  function renderModalPlayerInputs(count, names) {
    const container = document.getElementById("modalPlayerNameInputs");
    container.innerHTML = "";
    const fixed = fixedSatIndexes();

    for (let i = 0; i < count; i++) {
      const div = document.createElement("div");
      div.className = "modal-player-row";
      const val = names[i] || "";
      div.innerHTML = `
        <label>Player ${i + 1}</label>
        <input 
          class="modal-player-name"
          type="text" 
          placeholder="Player ${i + 1}" 
          value="${escapeAttribute(val)}" 
        />
        ${modalMode === "settings" ? `
          <label class="sit-checkbox-label">
            <input 
              class="modal-fixed-sat"
              type="checkbox"
              value="${i}"
              onchange="updateModalSitCheckboxes()"
              ${fixed.includes(i) ? "checked" : ""}
            />
            Sit indefinitely
          </label>
        ` : ""}
      `;
      container.appendChild(div);
    }
    updateModalSitCheckboxes();
  }

  function getModalNames() {
    const names = emptyPlayers();
    document.querySelectorAll(".modal-player-name").forEach((input, index) => {
      names[index] = input.value;
    });
    return names;
  }

  function getModalFixedSats() {
    return Array.from(document.querySelectorAll(".modal-fixed-sat:checked"))
      .map(input => parseInt(input.value));
  }

  function updateModalSitCheckboxes() {
    const checkboxes = Array.from(document.querySelectorAll(".modal-fixed-sat"));
    const maxSitting = sittingPlayerCount();
    const checkedCount = checkboxes.filter(checkbox => checkbox.checked).length;

    checkboxes.forEach(checkbox => {
      checkbox.disabled = !checkbox.checked && checkedCount >= maxSitting;
      checkbox.closest(".sit-checkbox-label").classList.toggle("disabled", checkbox.disabled);
    });
  }

  function handleModalGameTypeChange() {
    const mode = parseGameModeValue(document.getElementById("modalGameType").value);
    renderModalPlayerInputs(mode.gameType, getModalNames());
  }

  function saveModal(event) {
    event.preventDefault();
    const names = getModalNames();

    if (modalMode === "new") {
      const mode = parseGameModeValue(document.getElementById("modalGameType").value);
      state.handed = mode.handed;
      state.gameType = mode.gameType;
      state.players = names;
      state.history = [];
      state.roles = { picker: null, partner: null, sat: null };
      state.fixedSats = [];
      storeSatIndexes(defaultSatIndexes());
    } else if (modalMode === "settings") {
      for (let i = 0; i < state.gameType; i++) {
        state.players[i] = names[i];
      }
      state.fixedSats = getModalFixedSats();
      if (isFixedSat(state.roles.picker)) {
        state.roles.picker = null;
      }
      if (isFixedSat(state.roles.partner)) {
        state.roles.partner = null;
      }
      normalizeSatRoles();
    }

    closeModal();
    saveState();
    updateStandings();
  }

  function isHandReadyToSubmit() {
    return state.roles.picker !== null && satIndexes().length === sittingPlayerCount();
  }

  function updateSubmitButton() {
    document.getElementById("submitHandButton").disabled = !isHandReadyToSubmit();
  }

  function toggleHistoryOrder() {
    state.historyNewestFirst = !state.historyNewestFirst;
    saveState();
    updateStandings();
  }

  function toggleHistoryScoreMode() {
    state.historyShowTotals = !state.historyShowTotals;
    saveState();
    updateStandings();
  }

  function updateRoleInstruction() {
    const instruction = document.getElementById("roleInstruction");
    instruction.textContent = "Tap player cards to assign roles.";
  }

  function handleCardTap(index) {
    if (isFixedSat(index)) {
      return;
    }

    const sittingCount = sittingPlayerCount();
    const hasPartner = state.handed === 5;

    if (state.roles.picker === index) {
      state.roles.picker = null;
      if (hasPartner) {
        if (state.roles.partner !== null) state.roles.partner = null;
        state.roles.partner = index;
      } else if (sittingCount > 0 && satIndexes().length < sittingCount) {
        const sats = satIndexes();
        sats.push(index);
        storeSatIndexes(sats);
      }
    } else if (state.roles.partner === index) {
      state.roles.partner = null;
      if (sittingCount > 0) {
        const sats = satIndexes().filter(satIndex => satIndex !== index);
        if (sats.length < sittingCount) {
          sats.push(index);
          storeSatIndexes(sats);
        }
      }
    } else if (isSatOut(index)) {
      storeSatIndexes(satIndexes().filter(satIndex => satIndex !== index));
    } else {
      if (state.roles.picker === null) {
        state.roles.picker = index;
      } else if (hasPartner && state.roles.partner === null) {
        state.roles.partner = index;
      } else if (sittingCount > 0 && satIndexes().length < sittingCount) {
        const sats = satIndexes();
        sats.push(index);
        storeSatIndexes(sats);
      }
    }

    saveState();
    updateStandings();
  }

  function submitPresetHand() {
    if (!isHandReadyToSubmit()) {
      return;
    }

    const count = state.gameType;
    const pickerIdx = state.roles.picker;
    const partnerIdx = state.roles.partner;
    const sats = satIndexes();

    const outcome = document.getElementById("outcomeSelect").value;
    const mult = parseInt(document.getElementById("multiplierSelect").value);

    let deltas = new Array(count).fill(0);
    let basePicker = 2, basePartner = 1, baseDef = -1;

    switch (outcome) {
      case "schneider": 
        basePicker = 4; basePartner = 2; baseDef = -2; 
        break;
      case "schwarz": 
        basePicker = 6; basePartner = 3; baseDef = -3; 
        break;
      case "loss": 
        basePicker = -4; basePartner = -2; baseDef = 2; 
        break;
      case "schneider-loss": 
        basePicker = -8; basePartner = -4; baseDef = 4; 
        break;
      case "schwarz-loss": 
        basePicker = -12; basePartner = -6; baseDef = 6; 
        break;
    }

    let pPts = basePicker * mult;
    let ptPts = basePartner * mult;
    let defPts = baseDef * mult;

    if (state.handed === 3 || partnerIdx === null) {
      // Picker went alone
      let pickerTotal = 0;
      for (let i = 0; i < count; i++) {
        if (i !== pickerIdx && !sats.includes(i)) {
          deltas[i] = defPts;
          pickerTotal -= defPts;
        }
      }
      deltas[pickerIdx] = pickerTotal;
    } else {
      // Picker + Partner
      deltas[pickerIdx] = pPts;
      deltas[partnerIdx] = ptPts;
      for (let i = 0; i < count; i++) {
        if (i !== pickerIdx && i !== partnerIdx && !sats.includes(i)) {
          deltas[i] = defPts;
        }
      }
    }

    state.history.push({
      deltas,
      picker: pickerIdx,
      partner: state.handed === 5 && partnerIdx !== null ? partnerIdx : null
    });

    // Rotate sitting player clockwise for the next hand
    resetRoles();
    document.getElementById("outcomeSelect").selectedIndex = 0;
    document.getElementById("multiplierSelect").selectedIndex = 0;
    saveState();
    updateStandings();
  }

  function getDisplayName(index) {
    return state.players[index] && state.players[index].trim() !== "" 
      ? state.players[index] 
      : `Player ${index + 1}`;
  }

  function updateStandings() {
    const count = state.gameType;
    const totals = new Array(count).fill(0);
    updateRoleInstruction();

    state.history.forEach(hand => {
      hand.deltas.forEach((d, idx) => {
        if (idx < count) totals[idx] += d;
      });
    });

    // Render Standings Grid
    const totalsGrid = document.getElementById("totalsGrid");
    totalsGrid.style.setProperty("--mobile-player-columns", Math.ceil(count / 2));
    totalsGrid.style.setProperty("--player-count", count);
    totalsGrid.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const val = totals[i];
      const cls = val > 0 ? "pos" : val < 0 ? "neg" : "";
      
      let cardClass = "";
      let badgeHtml = "";

      if (state.roles.picker === i) {
        cardClass = "picker";
        badgeHtml = `<div class="role-badge badge-picker">Picker</div>`;
      } else if (state.roles.partner === i) {
        cardClass = "partner";
        badgeHtml = `<div class="role-badge badge-partner">Partner</div>`;
      } else if (isSatOut(i)) {
        cardClass = "sat";
        badgeHtml = isFixedSat(i)
          ? `<div class="role-badge badge-sitting">Sitting</div>`
          : `<div class="role-badge badge-sat">Sat Out</div>`;
      }

      totalsGrid.innerHTML += `
        <div class="total-card ${cardClass}" onclick="handleCardTap(${i})">
          <div class="total-name">${getDisplayName(i)}</div>
          <div class="total-score ${cls}">${val > 0 ? '+' : ''}${val}</div>
          <div class="role-badge-slot">${badgeHtml}</div>
        </div>
      `;
    }

    // Render Table Header
    const th = document.getElementById("tableHeader");
    th.innerHTML = "<th>#</th>";
    for (let i = 0; i < count; i++) {
      th.innerHTML += `<th>${getDisplayName(i)}</th>`;
    }

    // Render History Table
    const historyOrderButton = document.getElementById("historyOrderButton");
    historyOrderButton.textContent = state.historyNewestFirst ? "Oldest First" : "Newest First";
    const historyScoreModeButton = document.getElementById("historyScoreModeButton");
    historyScoreModeButton.textContent = state.historyShowTotals ? "Show Hands" : "Show Totals";
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    const runningTotals = new Array(count).fill(0);
    const historyRows = state.history.map((hand, hIdx) => {
      hand.deltas.forEach((delta, index) => {
        if (index < count) runningTotals[index] += delta;
      });

      return {
        hand,
        handNumber: hIdx + 1,
        totals: runningTotals.slice()
      };
    });
    if (state.historyNewestFirst) {
      historyRows.reverse();
    }

    historyRows.forEach(({ hand, handNumber, totals }) => {
      let tr = `<tr><td>${handNumber}</td>`;
      for (let i = 0; i < count; i++) {
        let val = state.historyShowTotals ? totals[i] : hand.deltas[i] || 0;
        let cls = val > 0 ? "pos" : val < 0 ? "neg" : "";
        if (hand.picker === i) {
          cls += " history-picker-cell";
        } else if (hand.partner === i) {
          cls += " history-partner-cell";
        }
        tr += `<td class="${cls}">${val > 0 ? '+' : ''}${val}</td>`;
      }
      tr += "</tr>";
      tbody.innerHTML += tr;
    });

    updateSubmitButton();
  }

  // Initial setup
  initGame();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/SheepsheadScoringApp/sw.js", {
        scope: "/SheepsheadScoringApp/"
      }).catch(error => {
        console.warn("Service worker registration failed", error);
      });
    });
  }
</script>
