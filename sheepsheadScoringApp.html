<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sheepshead Scorekeeper</title>
  <style>
    :root {
      --bg: #12181b;
      --card-bg: #1e262c;
      --accent: #00e676;
      --partner-color: #29b6f6;
      --sit-color: #78909c;
      --danger: #ff5252;
      --text: #eceff1;
      --subtext: #90a4ae;
      --border: #37474f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      position: relative;
    }
    h1 {
      margin: 0;
      color: var(--accent);
    }
    .menu-wrapper {
      position: relative;
      flex: 0 0 auto;
    }
    .menu-button {
      width: auto;
      min-width: 92px;
      margin-top: 0;
    }
    .menu-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 20;
      width: 190px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .menu-panel[hidden] {
      display: none;
    }
    .menu-item {
      margin: 0;
      border-radius: 0;
      background: #1a2127;
      color: var(--text);
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .menu-item:last-child {
      border-bottom: none;
    }
    .menu-item:hover {
      background: #2a353d;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 4px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      background: #2a353d;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 12px;
      border-radius: 4px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    button.btn-danger {
      background: var(--danger);
      color: #fff;
    }
    button.btn-secondary {
      background: #2a353d;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.65);
    }
    .modal-backdrop[hidden] {
      display: none;
    }
    .modal {
      width: min(100%, 560px);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .modal h2 {
      margin: 0 0 14px;
      color: var(--text);
      font-size: 1.2rem;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .modal-actions button {
      margin-top: 0;
    }

    /* Standings Grid */
    .totals-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }
    @media (min-width: 700px) {
      .totals-grid {
        grid-template-columns: repeat(var(--player-count, 6), minmax(0, 1fr));
      }
    }
    .total-card {
      background: #2a353d;
      padding: 10px 4px;
      border-radius: 6px;
      border: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      position: relative;
    }
    .total-card:hover {
      border-color: #546e7a;
    }
    .total-card.picker {
      border-color: var(--accent) !important;
      background: rgba(0, 230, 118, 0.15);
    }
    .total-card.partner {
      border-color: var(--partner-color) !important;
      background: rgba(41, 182, 246, 0.15);
    }
    .total-card.sat {
      border-color: var(--sit-color) !important;
      background: rgba(120, 144, 156, 0.2);
      opacity: 0.6;
    }
    .role-badge {
      font-size: 0.65rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 2px 4px;
      border-radius: 3px;
      margin-bottom: 2px;
      display: inline-block;
    }
    .badge-picker { background: var(--accent); color: #000; }
    .badge-partner { background: var(--partner-color); color: #000; }
    .badge-sat { background: var(--sit-color); color: #fff; }

    .total-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .total-score {
      font-size: 1.15rem;
      font-weight: bold;
      margin-top: 2px;
    }
    .pos { color: var(--accent); }
    .neg { color: var(--danger); }

    /* Score Table */
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    th, td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--subtext);
      font-size: 0.85rem;
      background: #1a2127;
    }
    .status-ok { color: var(--accent); font-weight: bold; }
    .status-err { color: var(--danger); font-weight: bold; }
    .instruction-text {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="app-header">
    <h1>Sheepshead Scorekeeper</h1>
    <div class="menu-wrapper">
      <button class="menu-button" type="button" onclick="toggleMenu()">Menu</button>
      <div class="menu-panel" id="appMenu" hidden>
        <button class="menu-item" type="button" onclick="openNewGameModal()">New Game</button>
        <button class="menu-item" type="button" onclick="openSettingsModal()">Modify Settings</button>
      </div>
    </div>
  </div>

  <!-- Interactive Current Standings Card -->
  <div class="card">
    <label style="font-weight: bold;">Current Standings</label>
    <div class="instruction-text">
      Tap player cards to assign roles: <b>1st tap = Picker</b> | <b>2nd tap = Partner</b> | <b>3rd tap = Sat Out</b>
    </div>
    <div class="totals-grid" id="totalsGrid"></div>
  </div>

  <!-- Entry Form Card -->
  <div class="card">
    <label style="margin-bottom: 10px; font-weight: bold;">Record Hand Outcome</label>
    <div class="grid">
      <div>
        <label>Hand Outcome</label>
        <select id="outcomeSelect">
          <option value="win">Win - Standard (+2 / +1)</option>
          <option value="schneider">Win - Schneider (+4 / +2)</option>
          <option value="schwarz">Win - No Tricks / Schwarz (+6 / +3)</option>
          <option value="loss">Loss - Double Bump (-4 / -2)</option>
          <option value="schneider-loss">Loss - Schneidered (-8 / -4)</option>
          <option value="schwarz-loss">Loss - No Tricks Taken (-12 / -6)</option>
        </select>
      </div>
      <div>
        <label>Multipliers</label>
        <select id="multiplierSelect">
          <option value="1">1x (Standard)</option>
          <option value="2">2x (Crack / Doubler)</option>
          <option value="4">4x (Re-Crack / Blitz)</option>
        </select>
      </div>
    </div>
    <button id="submitHandButton" onclick="submitPresetHand()" disabled>Submit Hand</button>
  </div>

  <!-- Score History Table -->
  <div class="card">
    <label style="margin-bottom: 8px;">Hand History & Zero-Sum Audit</label>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <form class="modal" onsubmit="saveModal(event)">
    <h2 id="modalTitle">New Game</h2>
    <div id="modalGameTypeField">
      <label>Game Mode</label>
      <select id="modalGameType" onchange="handleModalGameTypeChange()">
        <option value="5">5 Players</option>
        <option value="6">6 Players</option>
        <option value="7">7 Players</option>
      </select>
    </div>
    <div class="grid" style="margin-top: 12px;" id="modalPlayerNameInputs"></div>
    <div class="modal-actions">
      <button class="btn-secondary" type="button" onclick="closeModal()">Cancel</button>
      <button type="submit" id="modalSubmitButton">Save</button>
    </div>
  </form>
</div>

<script>
  const STORAGE_KEY = "sheepshead_scorekeeper_data";
  const MAX_PLAYERS = 7;

  let state = {
    gameType: 6,
    players: ["", "", "", "", "", "", ""],
    roles: { picker: null, partner: null, sat: null },
    history: []
  };
  let modalMode = null;

  function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        state = { ...state, ...parsed };
      } catch (e) {
        console.error("Could not parse saved game state", e);
      }
    }
    state.gameType = [5, 6, 7].includes(parseInt(state.gameType)) ? parseInt(state.gameType) : 6;
    state.players = Array.isArray(state.players) ? state.players : emptyPlayers();
    while (state.players.length < MAX_PLAYERS) {
      state.players.push("");
    }
    if (!state.roles) {
      state.roles = { picker: null, partner: null, sat: null };
    }

    if (sittingPlayerCount() > 0 && satIndexes().length < sittingPlayerCount()) {
      state.roles.sat = defaultSatIndexes();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function initGame() {
    loadState();
    updateStandings();
  }

  function toggleMenu() {
    const menu = document.getElementById("appMenu");
    menu.hidden = !menu.hidden;
  }

  function closeMenu() {
    document.getElementById("appMenu").hidden = true;
  }

  function openNewGameModal() {
    modalMode = "new";
    closeMenu();
    document.getElementById("modalTitle").textContent = "New Game";
    document.getElementById("modalSubmitButton").textContent = "Start Game";
    document.getElementById("modalGameTypeField").hidden = false;
    document.getElementById("modalGameType").value = state.gameType;
    renderModalPlayerInputs(state.gameType, emptyPlayers());
    document.getElementById("settingsModal").hidden = false;
  }

  function openSettingsModal() {
    modalMode = "settings";
    closeMenu();
    document.getElementById("modalTitle").textContent = "Modify Settings";
    document.getElementById("modalSubmitButton").textContent = "Save";
    document.getElementById("modalGameTypeField").hidden = true;
    renderModalPlayerInputs(state.gameType, state.players);
    document.getElementById("settingsModal").hidden = false;
  }

  function closeModal() {
    modalMode = null;
    document.getElementById("settingsModal").hidden = true;
  }

  function escapeAttribute(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function emptyPlayers() {
    return new Array(MAX_PLAYERS).fill("");
  }

  function sittingPlayerCount() {
    return Math.max(0, state.gameType - 5);
  }

  function defaultSatIndexes(count = state.gameType) {
    const sittingCount = Math.max(0, count - 5);
    const start = count - sittingCount;
    return Array.from({ length: sittingCount }, (_, index) => start + index);
  }

  function satIndexes() {
    const rawSat = state.roles.sat;
    const values = Array.isArray(rawSat) ? rawSat : rawSat === null ? [] : [rawSat];
    return values
      .map(index => parseInt(index))
      .filter((index, arrayIndex, indexes) => (
        Number.isInteger(index) &&
        index >= 0 &&
        index < state.gameType &&
        indexes.indexOf(index) === arrayIndex
      ));
  }

  function storeSatIndexes(indexes) {
    const sittingCount = sittingPlayerCount();
    const limited = indexes.slice(0, sittingCount);
    if (sittingCount === 0) {
      state.roles.sat = null;
    } else if (sittingCount === 1) {
      state.roles.sat = limited.length ? limited[0] : null;
    } else {
      state.roles.sat = limited;
    }
  }

  function isSatOut(index) {
    return satIndexes().includes(index);
  }

  function resetRoles() {
    const count = state.gameType;
    const sittingCount = sittingPlayerCount();
    let nextSats = [];

    // If transitioning from previous round, rotate sitting player clockwise
    if (sittingCount > 0) {
      const currentSats = satIndexes();
      nextSats = currentSats.length === sittingCount
        ? currentSats.map(index => (index + 1) % count)
        : defaultSatIndexes(count);
    }

    state.roles = { picker: null, partner: null, sat: null };
    storeSatIndexes(nextSats);
  }

  function renderModalPlayerInputs(count, names) {
    const container = document.getElementById("modalPlayerNameInputs");
    container.innerHTML = "";

    for (let i = 0; i < count; i++) {
      const div = document.createElement("div");
      const val = names[i] || "";
      div.innerHTML = `
        <label>Player ${i + 1}</label>
        <input 
          class="modal-player-name"
          type="text" 
          placeholder="Player ${i + 1}" 
          value="${escapeAttribute(val)}" 
        />
      `;
      container.appendChild(div);
    }
  }

  function getModalNames() {
    const names = emptyPlayers();
    document.querySelectorAll(".modal-player-name").forEach((input, index) => {
      names[index] = input.value;
    });
    return names;
  }

  function handleModalGameTypeChange() {
    const count = parseInt(document.getElementById("modalGameType").value);
    renderModalPlayerInputs(count, getModalNames());
  }

  function saveModal(event) {
    event.preventDefault();
    const names = getModalNames();

    if (modalMode === "new") {
      state.gameType = parseInt(document.getElementById("modalGameType").value);
      state.players = names;
      state.history = [];
      state.roles = { picker: null, partner: null, sat: null };
      storeSatIndexes(defaultSatIndexes());
    } else if (modalMode === "settings") {
      for (let i = 0; i < state.gameType; i++) {
        state.players[i] = names[i];
      }
    }

    closeModal();
    saveState();
    updateStandings();
  }

  function isHandReadyToSubmit() {
    return state.roles.picker !== null && satIndexes().length === sittingPlayerCount();
  }

  function updateSubmitButton() {
    document.getElementById("submitHandButton").disabled = !isHandReadyToSubmit();
  }

  function handleCardTap(index) {
    const sittingCount = sittingPlayerCount();

    if (state.roles.picker === index) {
      state.roles.picker = null;
      if (state.roles.partner !== null) state.roles.partner = null;
      state.roles.partner = index;
    } else if (state.roles.partner === index) {
      state.roles.partner = null;
      if (sittingCount > 0) {
        const sats = satIndexes().filter(satIndex => satIndex !== index);
        if (sats.length < sittingCount) {
          sats.push(index);
          storeSatIndexes(sats);
        }
      }
    } else if (isSatOut(index)) {
      storeSatIndexes(satIndexes().filter(satIndex => satIndex !== index));
    } else {
      if (state.roles.picker === null) {
        state.roles.picker = index;
      } else if (state.roles.partner === null) {
        state.roles.partner = index;
      } else if (sittingCount > 0 && satIndexes().length < sittingCount) {
        const sats = satIndexes();
        sats.push(index);
        storeSatIndexes(sats);
      }
    }

    saveState();
    updateStandings();
  }

  function submitPresetHand() {
    if (!isHandReadyToSubmit()) {
      return;
    }

    const count = state.gameType;
    const pickerIdx = state.roles.picker;
    const partnerIdx = state.roles.partner;
    const sats = satIndexes();

    const outcome = document.getElementById("outcomeSelect").value;
    const mult = parseInt(document.getElementById("multiplierSelect").value);

    let deltas = new Array(count).fill(0);
    let basePicker = 2, basePartner = 1, baseDef = -1;

    switch (outcome) {
      case "schneider": 
        basePicker = 4; basePartner = 2; baseDef = -2; 
        break;
      case "schwarz": 
        basePicker = 6; basePartner = 3; baseDef = -3; 
        break;
      case "loss": 
        basePicker = -4; basePartner = -2; baseDef = 2; 
        break;
      case "schneider-loss": 
        basePicker = -8; basePartner = -4; baseDef = 4; 
        break;
      case "schwarz-loss": 
        basePicker = -12; basePartner = -6; baseDef = 6; 
        break;
    }

    let pPts = basePicker * mult;
    let ptPts = basePartner * mult;
    let defPts = baseDef * mult;

    if (partnerIdx === null) {
      // Picker went alone
      let pickerTotal = 0;
      for (let i = 0; i < count; i++) {
        if (i !== pickerIdx && !sats.includes(i)) {
          deltas[i] = defPts;
          pickerTotal -= defPts;
        }
      }
      deltas[pickerIdx] = pickerTotal;
    } else {
      // Picker + Partner
      deltas[pickerIdx] = pPts;
      deltas[partnerIdx] = ptPts;
      for (let i = 0; i < count; i++) {
        if (i !== pickerIdx && i !== partnerIdx && !sats.includes(i)) {
          deltas[i] = defPts;
        }
      }
    }

    state.history.push({ deltas });

    // Rotate sitting player clockwise for the next hand
    resetRoles();
    document.getElementById("outcomeSelect").selectedIndex = 0;
    document.getElementById("multiplierSelect").selectedIndex = 0;
    saveState();
    updateStandings();
  }

  function getDisplayName(index) {
    return state.players[index] && state.players[index].trim() !== "" 
      ? state.players[index] 
      : `Player ${index + 1}`;
  }

  function updateStandings() {
    const count = state.gameType;
    const totals = new Array(count).fill(0);

    state.history.forEach(hand => {
      hand.deltas.forEach((d, idx) => {
        if (idx < count) totals[idx] += d;
      });
    });

    // Render Standings Grid
    const totalsGrid = document.getElementById("totalsGrid");
    totalsGrid.style.setProperty("--player-count", count);
    totalsGrid.innerHTML = "";
    for (let i = 0; i < count; i++) {
      const val = totals[i];
      const cls = val > 0 ? "pos" : val < 0 ? "neg" : "";
      
      let cardClass = "";
      let badgeHtml = "";

      if (state.roles.picker === i) {
        cardClass = "picker";
        badgeHtml = `<div class="role-badge badge-picker">Picker</div>`;
      } else if (state.roles.partner === i) {
        cardClass = "partner";
        badgeHtml = `<div class="role-badge badge-partner">Partner</div>`;
      } else if (isSatOut(i)) {
        cardClass = "sat";
        badgeHtml = `<div class="role-badge badge-sat">Sat Out</div>`;
      }

      totalsGrid.innerHTML += `
        <div class="total-card ${cardClass}" onclick="handleCardTap(${i})">
          ${badgeHtml}
          <div class="total-name">${getDisplayName(i)}</div>
          <div class="total-score ${cls}">${val > 0 ? '+' : ''}${val}</div>
        </div>
      `;
    }

    // Render Table Header
    const th = document.getElementById("tableHeader");
    th.innerHTML = "<th>#</th>";
    for (let i = 0; i < count; i++) {
      th.innerHTML += `<th>${getDisplayName(i)}</th>`;
    }
    th.innerHTML += "<th>Audit Check</th>";

    // Render History Table
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    state.history.forEach((hand, hIdx) => {
      let tr = `<tr><td>${hIdx + 1}</td>`;
      let sum = 0;
      for (let i = 0; i < count; i++) {
        let val = hand.deltas[i] || 0;
        sum += val;
        let cls = val > 0 ? "pos" : val < 0 ? "neg" : "";
        tr += `<td class="${cls}">${val > 0 ? '+' : ''}${val}</td>`;
      }
      let sumCls = sum === 0 ? "status-ok" : "status-err";
      tr += `<td class="${sumCls}">${sum === 0 ? '✓ 0' : '❌ ' + sum}</td></tr>`;
      tbody.innerHTML += tr;
    });

    updateSubmitButton();
  }

  // Initial setup
  initGame();
</script>
</body>
</html>
